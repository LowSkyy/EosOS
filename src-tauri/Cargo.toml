[package]
name = "eosos"
version = "0.1.0"
description = "Shell desktop per Windows 11 ispirata a macOS"
authors = ["Raffaele"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eosos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Abilita gli hook di test (es. EOSOS_TEST_PANIC) anche in release. Mai nella build distribuita.
test-hooks = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8.1"
png = { version = "0.17", default-features = false }
base64 = "0.22"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_Security", "Win32_UI_Accessibility", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_UI_Shell_Common", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_Packaging_Appx", "Storage", "Storage_Search", "Win32_System_DataExchange", "Win32_System_Memory", "Storage_Streams", "Foundation", "Foundation_Collections", "Networking", "Networking_Connectivity", "Win32_System_Power", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery", "Win32_System_Registry", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Foundation_Collections"] }
